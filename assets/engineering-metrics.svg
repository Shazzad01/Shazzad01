<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="metricsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1526" />
      <stop offset="100%" stop-color="#080c16" />
    </linearGradient>

    <!-- Card Glows -->
    <linearGradient id="metricBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: 'SF Mono', 'Fira Code', Consolas, monospace; }
      .label-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #94a3b8; letter-spacing: 0.5px; }
      .sub-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; fill: #64748b; }
    </style>
  </defs>

  <!-- Container Box -->
  <rect x="2" y="2" width="896" height="236" rx="14" fill="url(#metricsBg)" stroke="#1e293b" stroke-width="1.5" />
  <path d="M 16 2 L 884 2" stroke="url(#metricBorder)" stroke-width="2.5" stroke-linecap="round" />

  <!-- Section Header -->
  <g transform="translate(28, 24)">
    <circle cx="12" cy="12" r="10" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1" />
    <text x="12" y="16" font-size="12" text-anchor="middle">📊</text>
    <text x="32" y="17" fill="#f8fafc" font-size="15" font-weight="700" class="sans">
      Enterprise Quality Engineering Benchmarks &amp; Track Record
    </text>
    <text x="750" y="16" fill="#38bdf8" font-size="11" font-weight="600" class="mono" text-anchor="end">
      BRAIN STATION 23 PLC • PRODUCTION METRICS
    </text>
  </g>

  <!-- Metrics Grid (6 Items: 3 Columns x 2 Rows) -->

  <!-- Item 1: Experience -->
  <g transform="translate(28, 60)">
    <rect width="265" height="72" rx="10" fill="#131c31" stroke="#1e293b" stroke-width="1" />
    <text x="20" y="42" fill="#38bdf8" font-size="30" font-weight="800" class="sans">2+ Years</text>
    <text x="135" y="32" class="label-text">ENTERPRISE SQA</text>
    <text x="135" y="48" class="sub-text">Agile / Scrum Teams</text>
  </g>

  <!-- Item 2: Regression Reduction -->
  <g transform="translate(317, 60)">
    <rect width="265" height="72" rx="10" fill="#131c31" stroke="#1e293b" stroke-width="1" />
    <text x="20" y="42" fill="#34d399" font-size="30" font-weight="800" class="sans">30%+</text>
    <text x="115" y="32" class="label-text">CYCLE EFFICIENCY</text>
    <text x="115" y="48" class="sub-text">Playwright TS Automation</text>
  </g>

  <!-- Item 3: Concurrency / Users -->
  <g transform="translate(606, 60)">
    <rect width="265" height="72" rx="10" fill="#131c31" stroke="#1e293b" stroke-width="1" />
    <text x="20" y="42" fill="#f59e0b" font-size="30" font-weight="800" class="sans">15k+</text>
    <text x="110" y="32" class="label-text">CONCURRENT USERS</text>
    <text x="110" y="48" class="sub-text">JMeter &amp; k6 Load Tested</text>
  </g>

  <!-- Item 4: Defects Resolved -->
  <g transform="translate(28, 146)">
    <rect width="265" height="72" rx="10" fill="#131c31" stroke="#1e293b" stroke-width="1" />
    <text x="20" y="42" fill="#a78bfa" font-size="30" font-weight="800" class="sans">150+</text>
    <text x="110" y="32" class="label-text">DEFECTS RESOLVED</text>
    <text x="110" y="48" class="sub-text">Jira &amp; Trello Tracking</text>
  </g>

  <!-- Item 5: Production Leaks -->
  <g transform="translate(317, 146)">
    <rect width="265" height="72" rx="10" fill="#131c31" stroke="#1e293b" stroke-width="1" />
    <text x="20" y="44" fill="#10b981" font-size="34" font-weight="800" class="sans">0</text>
    <text x="70" y="32" class="label-text">CRITICAL DEFECTS</text>
    <text x="70" y="48" class="sub-text">At Public Production Launch</text>
  </g>

  <!-- Item 6: CI/CD Quality Gates -->
  <g transform="translate(606, 146)">
    <rect width="265" height="72" rx="10" fill="#131c31" stroke="#1e293b" stroke-width="1" />
    <text x="20" y="42" fill="#38bdf8" font-size="30" font-weight="800" class="sans">100%</text>
    <text x="115" y="32" class="label-text">CI/CD PR COVERAGE</text>
    <text x="115" y="48" class="sub-text">GitHub Actions &amp; GitLab CI</text>
  </g>
</svg>
