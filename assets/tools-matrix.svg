<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1526" />
      <stop offset="100%" stop-color="#080c16" />
    </linearGradient>

    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: 'SF Mono', 'Fira Code', Consolas, monospace; }
      .col-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #f8fafc; }
      .chip-bg { fill: #131c31; stroke: #1e293b; stroke-width: 0.8; rx: 6px; }
      .chip-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #cbd5e1; }
    </style>
  </defs>

  <!-- Container -->
  <rect x="2" y="2" width="896" height="276" rx="14" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1.2" />

  <!-- Top Title Bar -->
  <g transform="translate(28, 22)">
    <circle cx="10" cy="10" r="8" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1" />
    <text x="10" y="14" font-size="10" text-anchor="middle">🛠️</text>
    <text x="26" y="15" fill="#f8fafc" font-size="14" font-weight="700" class="sans">
      Technical Arsenal &amp; Tooling Ecosystem
    </text>
    <text x="840" y="14" fill="#64748b" font-size="11" font-weight="500" class="mono" text-anchor="end">
      VERIFIED ENTERPRISE STACK
    </text>
  </g>

  <!-- Divider Line -->
  <line x1="28" y1="52" x2="872" y2="52" stroke="#1e293b" stroke-width="1" />

  <!-- 4 COLUMNS (200px wide each, spaced across 844px) -->

  <!-- Column 1: Test Automation -->
  <g transform="translate(28, 70)">
    <circle cx="6" cy="6" r="4" fill="#38bdf8" />
    <text x="16" y="10" class="col-title">Test Automation</text>
    
    <!-- Item 1: Playwright -->
    <g transform="translate(0, 24)">
      <rect width="195" height="28" rx="6" fill="#131c31" stroke="#38bdf8" stroke-width="0.8" />
      <text x="12" y="18" class="chip-text">Playwright (TypeScript)</text>
      <text x="180" y="18" fill="#38bdf8" font-size="10" font-weight="700" class="mono" text-anchor="end">PRIMARY</text>
    </g>

    <!-- Item 2: Selenium -->
    <g transform="translate(0, 58)">
      <rect width="195" height="28" rx="6" fill="#131c31" stroke="#1e293b" stroke-width="0.8" />
      <text x="12" y="18" class="chip-text">Selenium WebDriver</text>
      <text x="180" y="18" fill="#64748b" font-size="10" class="mono" text-anchor="end">Java</text>
    </g>

    <!-- Item 3: Appium -->
    <g transform="translate(0, 92)">
      <rect width="195" height="28" rx="6" fill="#131c31" stroke="#1e293b" stroke-width="0.8" />
      <text x="12" y="18" class="chip-text">Appium Mobile (Android/iOS)</text>
    </g>

    <!-- Item 4: Cypress -->
    <g transform="translate(0, 126)">
      <rect width="195" height="28" rx="6" fill="#131c31" stroke="#1e293b" stroke-width="0.8" />
      <text x="12" y="18" class="chip-text">Cypress &amp; TestNG</text>
    </g>

    <!-- Item 5: POM -->
    <g transform="translate(0, 160)">
      <rect width="195" height="26" rx="6" fill="#0b1120" stroke="#1e293b" stroke-width="0.6" />
      <text x="97" y="17" fill="#94a3b8" font-size="10.5" class="mono" text-anchor="middle">Page Object Model (POM)</text>
    </g>
  </g>

  <!-- Column 2: Performance & API -->
  <g transform="translate(244, 70)">
    <circle cx="6" cy="6" r="4" fill="#f59e0b" />
    <text x="16" y="10" class="col-title">Performance &amp; API</text>

    <!-- Item 1: JMeter -->
    <g transform="translate(0, 24)">
      <rect width="195" height="28" rx="6" fill="#131c31" stroke="#f59e0b" stroke-width="0.8" />
      <text x="12" y="18" class="chip-text">Apache JMeter</text>
      <text x="180" y="18" fill="#f59e0b" font-size="10" font-weight="700" class="mono" text-anchor="end">LOAD</text>
    </g>

    <!-- Item 2: k6 -->
    <g transform="translate(0, 58)">
      <rect width="195" height="28" rx="6" fill="#131c31" stroke="#1e293b" stroke-width="0.8" />
      <text x="12" y="18" class="chip-text">Grafana k6</text>
      <text x="180" y="18" fill="#64748b" font-size="10" class="mono" text-anchor="end">Stress/Spike</text>
    </g>

    <!-- Item 3: Postman -->
    <g transform="translate(0, 92)">
      <rect width="195" height="28" rx="6" fill="#131c31" stroke="#1e293b" stroke-width="0.8" />
      <text x="12" y="18" class="chip-text">Postman API Collections</text>
    </g>

    <!-- Item 4: Newman -->
    <g transform="translate(0, 126)">
      <rect width="195" height="28" rx="6" fill="#131c31" stroke="#1e293b" stroke-width="0.8" />
      <text x="12" y="18" class="chip-text">Newman CLI &amp; BlazeMeter</text>
    </g>

    <!-- Item 5: REST -->
    <g transform="translate(0, 160)">
      <rect width="195" height="26" rx="6" fill="#0b1120" stroke="#1e293b" stroke-width="0.6" />
      <text x="97" y="17" fill="#94a3b8" font-size="10.5" class="mono" text-anchor="middle">RESTful &amp; Schema Validation</text>
    </g>
  </g>

  <!-- Column 3: CI/CD & Version Control -->
  <g transform="translate(460, 70)">
    <circle cx="6" cy="6" r="4" fill="#a855f7" />
    <text x="16" y="10" class="col-title">CI/CD &amp; DevOps</text>

    <!-- Item 1: GitHub Actions -->
    <g transform="translate(0, 24)">
      <rect width="195" height="28" rx="6" fill="#131c31" stroke="#a855f7" stroke-width="0.8" />
      <text x="12" y="18" class="chip-text">GitHub Actions</text>
      <text x="180" y="18" fill="#a855f7" font-size="10" font-weight="700" class="mono" text-anchor="end">CI/CD</text>
    </g>

    <!-- Item 2: GitLab CI -->
    <g transform="translate(0, 58)">
      <rect width="195" height="28" rx="6" fill="#131c31" stroke="#1e293b" stroke-width="0.8" />
      <text x="12" y="18" class="chip-text">GitLab CI/CD Pipelines</text>
    </g>

    <!-- Item 3: Git & GitHub -->
    <g transform="translate(0, 92)">
      <rect width="195" height="28" rx="6" fill="#131c31" stroke="#1e293b" stroke-width="0.8" />
      <text x="12" y="18" class="chip-text">Git &amp; GitHub Workflows</text>
    </g>

    <!-- Item 4: Automated PR Gates -->
    <g transform="translate(0, 126)">
      <rect width="195" height="28" rx="6" fill="#131c31" stroke="#1e293b" stroke-width="0.8" />
      <text x="12" y="18" class="chip-text">Pull Request Quality Gates</text>
    </g>

    <!-- Item 5: Continuous Testing -->
    <g transform="translate(0, 160)">
      <rect width="195" height="26" rx="6" fill="#0b1120" stroke="#1e293b" stroke-width="0.6" />
      <text x="97" y="17" fill="#94a3b8" font-size="10.5" class="mono" text-anchor="middle">Continuous Smoke &amp; Regression</text>
    </g>
  </g>

  <!-- Column 4: Languages & Agile -->
  <g transform="translate(676, 70)">
    <circle cx="6" cy="6" r="4" fill="#34d399" />
    <text x="16" y="10" class="col-title">Languages &amp; Agile</text>

    <!-- Item 1: TypeScript -->
    <g transform="translate(0, 24)">
      <rect width="195" height="28" rx="6" fill="#131c31" stroke="#34d399" stroke-width="0.8" />
      <text x="12" y="18" class="chip-text">TypeScript &amp; JavaScript</text>
      <text x="180" y="18" fill="#34d399" font-size="10" font-weight="700" class="mono" text-anchor="end">CODE</text>
    </g>

    <!-- Item 2: Java -->
    <g transform="translate(0, 58)">
      <rect width="195" height="28" rx="6" fill="#131c31" stroke="#1e293b" stroke-width="0.8" />
      <text x="12" y="18" class="chip-text">Java (OOP Architecture)</text>
    </g>

    <!-- Item 3: Jira Software -->
    <g transform="translate(0, 92)">
      <rect width="195" height="28" rx="6" fill="#131c31" stroke="#1e293b" stroke-width="0.8" />
      <text x="12" y="18" class="chip-text">Jira Software &amp; Azure Boards</text>
    </g>

    <!-- Item 4: Trello & Asana -->
    <g transform="translate(0, 126)">
      <rect width="195" height="28" rx="6" fill="#131c31" stroke="#1e293b" stroke-width="0.8" />
      <text x="12" y="18" class="chip-text">Trello, Asana &amp; Scrum</text>
    </g>

    <!-- Item 5: Defect Tracking -->
    <g transform="translate(0, 160)">
      <rect width="195" height="26" rx="6" fill="#0b1120" stroke="#1e293b" stroke-width="0.6" />
      <text x="97" y="17" fill="#94a3b8" font-size="10.5" class="mono" text-anchor="middle">Defect Lifecycle &amp; RCA</text>
    </g>
  </g>
</svg>
