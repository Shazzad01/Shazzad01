<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 135" width="100%" height="100%">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: 'SF Mono', 'Fira Code', Consolas, monospace; }
      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(0.9); }
      }
      .dot {
        animation: pulse 2s infinite ease-in-out;
        transform-origin: 52px 28px;
      }
    </style>
  </defs>

  <!-- Clean Minimalist Container -->
  <rect x="2" y="2" width="896" height="131" rx="12" fill="url(#headerGrad)" stroke="#334155" stroke-width="1.2" />
  <rect x="2" y="2" width="896" height="2.5" fill="url(#accentLine)" rx="1.25" />

  <!-- Status Chip -->
  <g transform="translate(32, 20)">
    <rect width="320" height="24" rx="12" fill="#0b0f19" stroke="#334155" stroke-width="0.8" />
    <circle cx="12" cy="12" r="4" fill="#10b981" class="dot" />
    <text x="24" y="16" fill="#94a3b8" font-size="10.5" font-weight="600" class="mono" letter-spacing="1">
      SQA ENGINEER II • BRAIN STATION 23 PLC
    </text>
  </g>

  <!-- Title -->
  <text x="32" y="82" fill="#f8fafc" font-size="34" font-weight="800" class="sans" letter-spacing="-0.5">
    Muhammad Shazzad Mia
  </text>

  <!-- Subtitle -->
  <text x="32" y="108" fill="#94a3b8" font-size="14" font-weight="500" class="sans">
    Test Automation <tspan fill="#38bdf8">•</tspan> Performance Engineering <tspan fill="#38bdf8">•</tspan> API Verification <tspan fill="#38bdf8">•</tspan> CI/CD Quality Gates
  </text>
</svg>
