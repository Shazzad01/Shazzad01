<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12" />
      <stop offset="50%" stop-color="#0c1222" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Animated Border Glow -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#818cf8;#c084fc;#38bdf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8;#c084fc;#38bdf8;#818cf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#c084fc">
        <animate attributeName="stop-color" values="#c084fc;#38bdf8;#818cf8;#c084fc" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Text Shimmer Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#818cf8" />
      <stop offset="70%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#38bdf8" />
      <animateTransform attributeName="gradientTransform" type="translate" from="-900,0" to="900,0" dur="10s" repeatCount="indefinite" />
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="glowLeft" cx="15%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#070a12" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowRight" cx="85%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#070a12" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.4" />
    </pattern>

    <style>
      .mono { font-family: 'SF Mono', 'Fira Code', 'Roboto Mono', Menlo, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(0.9); }
      }
      .pulsing-dot {
        animation: pulse 2.5s infinite ease-in-out;
        transform-origin: 52px 42px;
      }
    </style>
  </defs>

  <!-- Container Box -->
  <rect x="2" y="2" width="896" height="276" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />
  
  <!-- Subtle Grid Overlay -->
  <rect x="2" y="2" width="896" height="276" rx="16" fill="url(#grid)" />

  <!-- Radial Flares -->
  <rect x="2" y="2" width="896" height="276" rx="16" fill="url(#glowLeft)" pointer-events="none" />
  <rect x="2" y="2" width="896" height="276" rx="16" fill="url(#glowRight)" pointer-events="none" />

  <!-- Animated Border Highlight (Top & Bottom Accent Line) -->
  <rect x="2" y="2" width="896" height="3" fill="url(#borderGrad)" rx="1.5" />
  <rect x="2" y="275" width="896" height="3" fill="url(#borderGrad)" rx="1.5" />

  <!-- Top Status Badge -->
  <g transform="translate(40, 28)">
    <rect x="0" y="0" width="375" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <circle cx="15" cy="14" r="5" fill="#10b981" class="pulsing-dot" />
    <circle cx="15" cy="14" r="9" fill="#10b981" opacity="0.25" />
    <text x="32" y="18" fill="#94a3b8" font-size="11" font-weight="600" class="mono" letter-spacing="1.2">
      SQA ENGINEER II • BRAIN STATION 23 PLC
    </text>
  </g>

  <!-- Main Headline Name -->
  <text x="40" y="120" fill="url(#titleGrad)" font-size="44" font-weight="800" class="sans" letter-spacing="-0.5">
    Muhammad Shazzad Mia
  </text>

  <!-- Subtitle Tagline -->
  <text x="42" y="156" fill="#cbd5e1" font-size="18" font-weight="500" class="sans">
    Senior Test Automation Architect &amp; Performance Engineering Specialist
  </text>
  
  <text x="42" y="182" fill="#64748b" font-size="13" font-weight="400" class="sans">
    Ensuring resilience &amp; zero-defect releases for high-traffic enterprise web, iOS &amp; Android ecosystems.
  </text>

  <!-- Interactive/Pill Capabilities -->
  <g transform="translate(40, 215)">
    <!-- Pill 1: Playwright -->
    <g transform="translate(0, 0)">
      <rect width="180" height="34" rx="8" fill="#131c31" stroke="#1e293b" stroke-width="1" />
      <circle cx="18" cy="17" r="4" fill="#38bdf8" />
      <text x="32" y="22" fill="#e2e8f0" font-size="12" font-weight="600" class="sans">Playwright (TypeScript)</text>
    </g>

    <!-- Pill 2: Selenium & Appium -->
    <g transform="translate(195, 0)">
      <rect width="185" height="34" rx="8" fill="#131c31" stroke="#1e293b" stroke-width="1" />
      <circle cx="18" cy="17" r="4" fill="#10b981" />
      <text x="32" y="22" fill="#e2e8f0" font-size="12" font-weight="600" class="sans">Selenium &amp; Mobile Appium</text>
    </g>

    <!-- Pill 3: JMeter & k6 -->
    <g transform="translate(395, 0)">
      <rect width="185" height="34" rx="8" fill="#131c31" stroke="#1e293b" stroke-width="1" />
      <circle cx="18" cy="17" r="4" fill="#f59e0b" />
      <text x="32" y="22" fill="#e2e8f0" font-size="12" font-weight="600" class="sans">JMeter &amp; k6 Load Testing</text>
    </g>

    <!-- Pill 4: CI/CD Quality Gates -->
    <g transform="translate(595, 0)">
      <rect width="220" height="34" rx="8" fill="#131c31" stroke="#1e293b" stroke-width="1" />
      <circle cx="18" cy="17" r="4" fill="#a855f7" />
      <text x="32" y="22" fill="#e2e8f0" font-size="12" font-weight="600" class="sans">CI/CD Automated Quality Gates</text>
    </g>
  </g>
</svg>
