<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12" />
      <stop offset="50%" stop-color="#0c1222" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Animated Top/Bottom Laser Line -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#818cf8;#34d399;#38bdf8" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8;#34d399;#38bdf8;#818cf8" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#34d399">
        <animate attributeName="stop-color" values="#34d399;#38bdf8;#818cf8;#34d399" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="glowLeft" cx="15%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#070a12" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowRight" cx="85%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#070a12" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.45" />
    </pattern>

    <style>
      .mono { font-family: 'SF Mono', 'Fira Code', 'Roboto Mono', Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.35; transform: scale(0.9); }
      }
      .pulsing-dot {
        animation: pulse 2s infinite ease-in-out;
        transform-origin: 52px 42px;
      }
    </style>
  </defs>

  <!-- Container Box -->
  <rect x="2" y="2" width="896" height="276" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />
  
  <!-- Subtle Grid Overlay -->
  <rect x="2" y="2" width="896" height="276" rx="16" fill="url(#grid)" />

  <!-- Radial Glow Flares -->
  <rect x="2" y="2" width="896" height="276" rx="16" fill="url(#glowLeft)" pointer-events="none" />
  <rect x="2" y="2" width="896" height="276" rx="16" fill="url(#glowRight)" pointer-events="none" />

  <!-- Glowing Laser Accents -->
  <rect x="2" y="2" width="896" height="3" fill="url(#borderGrad)" rx="1.5" />
  <rect x="2" y="275" width="896" height="3" fill="url(#borderGrad)" rx="1.5" />

  <!-- Top Status Badge -->
  <g transform="translate(40, 26)">
    <rect x="0" y="0" width="375" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <circle cx="15" cy="14" r="5" fill="#10b981" class="pulsing-dot" />
    <circle cx="15" cy="14" r="9" fill="#10b981" opacity="0.25" />
    <text x="32" y="18" fill="#94a3b8" font-size="11" font-weight="600" class="mono" letter-spacing="1.2">
      SQA ENGINEER II • BRAIN STATION 23 PLC
    </text>
  </g>

  <!-- Main Headline Name -->
  <text x="40" y="115" fill="#f8fafc" font-size="46" font-weight="800" class="sans" letter-spacing="-0.5">
    Muhammad Shazzad Mia
  </text>

  <!-- Subtitle -->
  <text x="42" y="150" fill="#94a3b8" font-size="16" font-weight="500" class="sans">
    Quality Engineering Specialist • Test Automation &amp; Performance Architecture
  </text>

  <!-- Self-Contained Rotating Animated Headline -->
  <g transform="translate(42, 180)">
    <!-- Line 1: Playwright TS -->
    <text font-size="14.5" font-weight="600" class="mono">
      <tspan fill="#38bdf8">⚡ CORE AUTOMATION:</tspan> 
      <tspan fill="#e2e8f0"> Playwright (TypeScript), Selenium WebDriver &amp; Appium Mobile</tspan>
      <animate attributeName="opacity" values="1;1;0;0;0;0;1" dur="9s" repeatCount="indefinite" />
    </text>

    <!-- Line 2: Performance -->
    <text font-size="14.5" font-weight="600" class="mono">
      <tspan fill="#f59e0b">⚡ LOAD &amp; STRESS:</tspan> 
      <tspan fill="#e2e8f0"> Apache JMeter, Grafana k6 &amp; High-Concurrency Benchmarking</tspan>
      <animate attributeName="opacity" values="0;0;1;1;0;0;0" dur="9s" repeatCount="indefinite" />
    </text>

    <!-- Line 3: Enterprise QA -->
    <text font-size="14.5" font-weight="600" class="mono">
      <tspan fill="#34d399">⚡ CI/CD PIPELINES:</tspan> 
      <tspan fill="#e2e8f0"> GitHub Actions &amp; GitLab CI Continuous Quality Gates</tspan>
      <animate attributeName="opacity" values="0;0;0;0;1;1;0" dur="9s" repeatCount="indefinite" />
    </text>
  </g>

  <!-- Capability Badges -->
  <g transform="translate(40, 218)">
    <g transform="translate(0, 0)">
      <rect width="180" height="32" rx="8" fill="#131c31" stroke="#1e293b" stroke-width="1" />
      <circle cx="16" cy="16" r="4" fill="#38bdf8" />
      <text x="28" y="21" fill="#e2e8f0" font-size="11.5" font-weight="600" class="sans">Playwright (TypeScript)</text>
    </g>

    <g transform="translate(195, 0)">
      <rect width="185" height="32" rx="8" fill="#131c31" stroke="#1e293b" stroke-width="1" />
      <circle cx="16" cy="16" r="4" fill="#10b981" />
      <text x="28" y="21" fill="#e2e8f0" font-size="11.5" font-weight="600" class="sans">Selenium &amp; Mobile Appium</text>
    </g>

    <g transform="translate(395, 0)">
      <rect width="185" height="32" rx="8" fill="#131c31" stroke="#1e293b" stroke-width="1" />
      <circle cx="16" cy="16" r="4" fill="#f59e0b" />
      <text x="28" y="21" fill="#e2e8f0" font-size="11.5" font-weight="600" class="sans">JMeter &amp; k6 Load Testing</text>
    </g>

    <g transform="translate(595, 0)">
      <rect width="220" height="32" rx="8" fill="#131c31" stroke="#1e293b" stroke-width="1" />
      <circle cx="16" cy="16" r="4" fill="#a855f7" />
      <text x="28" y="21" fill="#e2e8f0" font-size="11.5" font-weight="600" class="sans">CI/CD Automated Quality Gates</text>
    </g>
  </g>
</svg>
