      <stop offset="0%" stop-color="#0e1526" />
      <stop offset="100%" stop-color="#080c16" />
    </linearGradient>
    <linearGradient id="cardGlow1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#080c16" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="cardGlow2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#080c16" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="cardGlow3" x1="0%" y1="0%" x2="100%" y2="100%">
