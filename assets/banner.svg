<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 140" width="100%" height="100%">
  <defs>
    <!-- Adaptive Text Gradient -->
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#0284c7" />
      <animate attributeName="stop-color" values="#0284c7;#6366f1;#0ea5e9;#0284c7" dur="6s" repeatCount="indefinite" />
    </linearGradient>

    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: 'SF Mono', 'Fira Code', 'Roboto Mono', Menlo, Consolas, monospace; }
      
      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.35; transform: scale(0.85); }
      }
      .live-dot {
        animation: pulse 2.2s infinite ease-in-out;
        transform-origin: 278px 16px;
      }

      @keyframes cycle1 {
        0%, 28% { opacity: 1; transform: translateY(0); }
        33%, 95% { opacity: 0; transform: translateY(-3px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes cycle2 {
        0%, 30% { opacity: 0; transform: translateY(3px); }
        35%, 62% { opacity: 1; transform: translateY(0); }
        67%, 100% { opacity: 0; transform: translateY(-3px); }
      }
      @keyframes cycle3 {
        0%, 64% { opacity: 0; transform: translateY(3px); }
        69%, 96% { opacity: 1; transform: translateY(0); }
        100% { opacity: 0; transform: translateY(-3px); }
      }

      .role-1 { animation: cycle1 9s infinite ease-in-out; }
      .role-2 { animation: cycle2 9s infinite ease-in-out; }
      .role-3 { animation: cycle3 9s infinite ease-in-out; }
    </style>
  </defs>

  <!-- Transparent Background (Adapts Natively to Both Light and Dark GitHub Themes) -->
  <rect width="100%" height="100%" fill="none" />

  <!-- Top Status Badge (Centered) -->
  <g transform="translate(425, 18)" text-anchor="middle">
    <!-- Centered status badge: width 340, centered at 0 -->
    <rect x="-170" y="0" width="340" height="24" rx="12" fill="#0f172a" stroke="#334155" stroke-width="0.8" />
    <circle cx="-148" cy="12" r="4.5" fill="#10b981" class="live-dot" />
    <text x="8" y="16" fill="#94a3b8" font-size="10.5" font-weight="600" class="mono" letter-spacing="1.2">
      SQA ENGINEER II • BRAIN STATION 23 PLC
    </text>
  </g>

  <!-- Big Name Headline (Centered) -->
  <text x="425" y="80" text-anchor="middle" fill="url(#nameGrad)" font-size="40" font-weight="800" class="sans" letter-spacing="-0.5">
    Muhammad Shazzad Mia
  </text>

  <!-- Animated Rotating Tagline (Centered) -->
  <g transform="translate(425, 115)" text-anchor="middle">
    <!-- Role 1 -->
    <g class="role-1">
      <text font-size="14.5" font-weight="600" class="mono">
        <tspan fill="#0284c7">⚡ E2E Automation:</tspan>
        <tspan fill="#475569"> Playwright (TypeScript) • Selenium • Appium</tspan>
      </text>
    </g>

    <!-- Role 2 -->
    <g class="role-2">
      <text font-size="14.5" font-weight="600" class="mono">
        <tspan fill="#d97706">⚡ Performance Testing:</tspan>
        <tspan fill="#475569"> Apache JMeter • Grafana k6 • BlazeMeter</tspan>
      </text>
    </g>

    <!-- Role 3 -->
    <g class="role-3">
      <text font-size="14.5" font-weight="600" class="mono">
        <tspan fill="#059669">⚡ Quality Engineering:</tspan>
        <tspan fill="#475569"> CI/CD Automated PR Gates • Postman &amp; Newman API</tspan>
      </text>
    </g>
  </g>
</svg>
