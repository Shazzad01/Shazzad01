<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1526" />
      <stop offset="100%" stop-color="#080c16" />
    </linearGradient>
    <linearGradient id="glowShwopno" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#080c16" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="glowParagon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#080c16" stop-opacity="0" />
    </linearGradient>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: 'SF Mono', 'Fira Code', Consolas, monospace; }
    </style>
  </defs>

  <!-- CARD 1: Shwopno.com (Left, 436x236) -->
  <g transform="translate(2, 2)">
    <rect width="440" height="236" rx="14" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.5" />
    <rect width="440" height="236" rx="14" fill="url(#glowShwopno)" />
    <!-- Top accent border line -->
    <path d="M 16 0 L 424 0" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />

    <!-- Badge -->
    <rect x="24" y="22" width="220" height="22" rx="11" fill="#0369a1" fill-opacity="0.25" stroke="#0284c7" stroke-width="0.75" />
    <text x="34" y="37" fill="#7dd3fc" font-size="10" font-weight="700" class="mono" letter-spacing="0.8">RETAIL E-COMMERCE LEADER</text>

    <!-- Title -->
    <text x="24" y="74" fill="#f8fafc" font-size="22" font-weight="800" class="sans">Shwopno.com</text>
    <text x="24" y="93" fill="#64748b" font-size="12" class="sans">Web, Android &amp; iOS Multi-Platform Testing</text>

    <!-- Big Metric -->
    <g transform="translate(24, 110)">
      <rect width="180" height="52" rx="8" fill="#131c31" stroke="#334155" stroke-width="1" />
      <text x="16" y="36" fill="#38bdf8" font-size="28" font-weight="800" class="sans">30%+</text>
      <text x="96" y="27" fill="#94a3b8" font-size="10" font-weight="600" class="sans">REGRESSION</text>
      <text x="96" y="41" fill="#94a3b8" font-size="10" font-weight="600" class="sans">TIME CUT</text>
    </g>

    <g transform="translate(216, 110)">
      <rect width="200" height="52" rx="8" fill="#131c31" stroke="#334155" stroke-width="1" />
      <text x="16" y="36" fill="#10b981" font-size="24" font-weight="800" class="sans">100%</text>
      <text x="96" y="27" fill="#94a3b8" font-size="10" font-weight="600" class="sans">CI/CD PR</text>
      <text x="96" y="41" fill="#94a3b8" font-size="10" font-weight="600" class="sans">AUTOMATED</text>
    </g>

    <!-- Footer tags -->
    <text x="24" y="195" fill="#cbd5e1" font-size="11.5" class="sans">
      • <tspan font-weight="600" fill="#f1f5f9">Playwright TS</tspan> framework integrated into GitHub Actions
    </text>
    <text x="24" y="214" fill="#cbd5e1" font-size="11.5" class="sans">
      • <tspan font-weight="600" fill="#f1f5f9">Apache JMeter</tspan> load testing for high concurrent traffic events
    </text>
  </g>

  <!-- CARD 2: paragonfood.com.bd (Right, 440x236) -->
  <g transform="translate(456, 2)">
    <rect width="440" height="236" rx="14" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.5" />
    <rect width="440" height="236" rx="14" fill="url(#glowParagon)" />
    <!-- Top accent border line -->
    <path d="M 16 0 L 424 0" stroke="#10b981" stroke-width="2" stroke-linecap="round" />

    <!-- Badge -->
    <rect x="24" y="22" width="220" height="22" rx="11" fill="#065f46" fill-opacity="0.25" stroke="#059669" stroke-width="0.75" />
    <text x="34" y="37" fill="#6ee7b7" font-size="10" font-weight="700" class="mono" letter-spacing="0.8">FOOD COMMERCE &amp; LOGISTICS</text>

    <!-- Title -->
    <text x="24" y="74" fill="#f8fafc" font-size="22" font-weight="800" class="sans">paragonfood.com.bd</text>
    <text x="24" y="93" fill="#64748b" font-size="12" class="sans">E-Commerce Web &amp; Mobile Application</text>

    <!-- Big Metric -->
    <g transform="translate(24, 110)">
      <rect width="180" height="52" rx="8" fill="#131c31" stroke="#334155" stroke-width="1" />
      <text x="20" y="37" fill="#10b981" font-size="30" font-weight="800" class="sans">0</text>
      <text x="65" y="27" fill="#94a3b8" font-size="10" font-weight="600" class="sans">CRITICAL LEAKS</text>
      <text x="65" y="41" fill="#94a3b8" font-size="10" font-weight="600" class="sans">AT LAUNCH</text>
    </g>

    <g transform="translate(216, 110)">
      <rect width="200" height="52" rx="8" fill="#131c31" stroke="#334155" stroke-width="1" />
      <text x="16" y="36" fill="#a855f7" font-size="26" font-weight="800" class="sans">100%</text>
      <text x="96" y="27" fill="#94a3b8" font-size="10" font-weight="600" class="sans">CROSS-BROWSER</text>
      <text x="96" y="41" fill="#94a3b8" font-size="10" font-weight="600" class="sans">PARITY</text>
    </g>

    <!-- Footer tags -->
    <text x="24" y="195" fill="#cbd5e1" font-size="11.5" class="sans">
      • End-to-end checkout, payment gateway &amp; cart validation
    </text>
    <text x="24" y="214" fill="#cbd5e1" font-size="11.5" class="sans">
      • Automated continuous regression checks via <tspan font-weight="600" fill="#f1f5f9">GitLab CI/CD</tspan>
    </text>
  </g>
</svg>
